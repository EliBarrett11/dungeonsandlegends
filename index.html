<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeons &amp; Legends</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="start-menu" class="screen">
    <h1 class="title">Dungeons &amp; Legends</h1>
    <button id="new-game-btn" class="menu-button">New Game</button>
  </main>

  <main id="lobby" class="screen hidden">
    <h2 class="screen-heading">Match Lobby</h2>
    <ol id="slot-list" class="slot-list"></ol>
    <button id="start-match-btn" class="menu-button">Start Match</button>
  </main>

  <script src="game.js"></script>
</body>
</html>
